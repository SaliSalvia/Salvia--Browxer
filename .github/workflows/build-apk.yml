name: Build APK

# Builds the web UI (Vite) into the Android assets, then builds the Android app and publishes
# the APK as a workflow artifact on every push. Pushing a tag like v1.0.0 also attaches the APK
# to a GitHub Release, which is the easiest way to download it from a phone / Termux.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # only used to create a Release on tag pushes

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash     # adds -eo pipefail, so `gradlew | tee` fails the step when gradlew fails

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Web UI -> Android assets ----------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check web code (advisory)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build web bundle into Android assets
        run: |
          # `vite build` directly: the type-check above is advisory and must not block the APK.
          npx vite build
          rm -rf app/src/main/assets/www
          mkdir -p app/src/main/assets/www
          cp -r dist/. app/src/main/assets/www/
          test -f app/src/main/assets/www/index.html || { echo "assets/www/index.html missing"; exit 1; }
          echo "Bundled web files:"; find app/src/main/assets/www -type f | head -40

      # ---------- Android ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || echo "sdkmanager failed (non-fatal, Gradle can fetch missing packages itself)"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee gradle-test.log

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-debug.log

      - name: Collect debug APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/SalviaBrowxer-debug.apk
          ls -l out

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SalviaBrowxer-debug-apk
          path: out/SalviaBrowxer-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK (R8, advisory)
        id: release
        continue-on-error: true
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-release.log
          cp app/build/outputs/apk/release/app-release.apk out/SalviaBrowxer-release.apk

      - name: Upload release APK
        if: steps.release.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SalviaBrowxer-release-apk
          path: out/SalviaBrowxer-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Note release build failure
        if: steps.release.outcome == 'failure'
        run: echo "::warning title=Release APK::assembleRelease failed (R8/shrink). The debug APK is unaffected - see the build-logs artifact."

      - name: Publish GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.apk \
            --title "SalviaBrowxer $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" out/*.apk --clobber

      - name: Job summary
        if: always()
        run: |
          {
            echo "## SalviaBrowxer APK build"
            echo
            if ls out/*.apk > /dev/null 2>&1; then
              echo "| File | Size | SHA-256 |"
              echo "|---|---|---|"
              for f in out/*.apk; do
                echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
              done
              echo
              echo "Download the APK from the **Artifacts** section of this run"
              echo "(or from the Release page when the run was triggered by a \`v*\` tag)."
              if [ "${HAS_SIGNING}" != "true" ]; then
                echo
                echo "_Release APK is signed with the shared debug key (no signing secrets configured)._"
              fi
            else
              echo "No APK was produced - see the failed step and the error annotations."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Diagnostics ----------
      - name: Surface Gradle errors
        if: failure()
        run: |
          for log in gradle-debug.log gradle-release.log gradle-test.log; do
            [ -f "$log" ] || continue
            echo "----- $log -----"
            grep -hE '^e: |error: |FAILURE:|What went wrong|Could not resolve|> Task .* FAILED' "$log" | head -60 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=$log::$line"
            done
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gradle-*.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
