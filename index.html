    <meta property="og:title" content="SalviaBrowxer" />

    <link rel="icon" type="image/jpeg" href="./assets/aistudio/Picsart_26-11-04_21-40-17-985_7c4ea56f.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: offline (or slow-network) cold starts must not wait on Google
         Fonts; the bundled Vazirmatn and system fallbacks render immediately. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Relay for the native bridge arm token. The Android host delivers a one-time secret to
      // this (main) frame via evaluateJavascript; sandboxed iframes cannot see it. The token
      // unlocks the state-changing SalviaNative methods. Must be an inline script so it exists
      // before any React code runs.
      window.__salviaReceiveArmToken = function (token) {
        try {
          if (window.SalviaNative && typeof window.SalviaNative.armUiBridge === 'function') {
            window.SalviaNative.armUiBridge(token);
          }
        } catch (e) {}
      };
    </script>
  </head>
  <body class="bg-black text-[#F4F2FF] antialiased selection:bg-[#8F6BFF]/35 selection:text-[#F4F2FF]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
